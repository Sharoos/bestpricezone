name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Show .gitignore + repo listing (debug)
        run: |
          echo "---- .gitignore ----"
          sed -n '1,200p' .gitignore || true
          echo "---- repo root ----"
          ls -la

      - name: Create .env (safe method)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          printf 'TG_API_ID=%s\n' "$TG_API_ID" > .env
          printf 'TG_API_HASH=%s\n' "$TG_API_HASH" >> .env
          printf 'TG_STRING_SESSION=%s\n' "$TG_STRING_SESSION" >> .env
          printf 'CHANNEL_USERNAME=%s\n' "$CHANNEL_USERNAME" >> .env
          printf 'HERO_BANNER=banner.jpg\n' >> .env
          printf 'HERO_HEIGHT=300px\n' >> .env
          printf 'MAX_KEEP=200\n' >> .env
          printf 'CLEAN_IMAGES_ON_RUN=0\n' >> .env
          echo ".env created."

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          MAX_KEEP: '200'
          CLEAN_IMAGES_ON_RUN: '0'
        run: |
          echo "Running telegram_to_site.py (MAX_KEEP=$MAX_KEEP)"
          python telegram_to_site.py

      - name: Show assets AFTER build (debug)
        run: |
          echo "---- assets (after) ----"
          ls -la assets || echo "assets missing"
          echo "image count:"
          find assets/images -type f | wc -l || true
          [ -f assets/state.db ] && echo "state.db exists" || echo "state.db missing"

      - name: Commit persisted assets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add -f assets || true
          git add -f assets/state.db assets/cards.json || true
          git add -f assets/images || true
          if git diff --staged --quiet; then
            echo "No assets changes to commit."
          else
            git commit -m "Update persisted state and images [skip ci]" || true
            git push origin HEAD:main
          fi

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
