name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# Opt into Node 24 early to prevent pipeline breakage on June 16, 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests
          sudo apt-get install jq -y

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          rm -f .env
          export HERO_BANNER=banner.jpg
          export HERO_HEIGHT=300px
          export MAX_KEEP=300
          export CLEAN_IMAGES_ON_RUN=0
          python telegram_to_site.py

      - name: Commit and Push changes
        id: git_commit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f assets/state.db assets/cards.json assets/images/ index.html || true
          
          if git diff --staged --quiet; then
            echo "No new deals found. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update deals and database"
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: steps.git_commit.outputs.pushed == 'true'
        run: |
          # 1. Get the number of new deals
          NEW_COUNT=$(git diff HEAD^ HEAD assets/cards.json | grep '+    "title":' | wc -l)
          echo "Found $NEW_COUNT new deals. Posting..."

          for (( i=0; i<$NEW_COUNT; i++ ))
          do
            TITLE=$(jq -r ".[$i].title" assets/cards.json)
            LINK=$(jq -r ".[$i].buy_link" assets/cards.json)
            IMG_PATH=$(jq -r ".[$i].local_image" assets/cards.json)
            IMG_URL="https://raw.githubusercontent.com/Sharoos/bestpricezone/main/$IMG_PATH"

            # 2. Advanced Keyword Research Logic based on your site (bestpricezone.in)
            EXTRAS=""
            
            # Category: Tech & Electronics
            if [[ "$TITLE" =~ "Mouse"|"Gaming"|"Buds"|"Earbuds"|"Fan"|"TV"|"Phone"|"Laptop" ]]; then
                EXTRAS="#TechDealsIndia #GadgetLoot #GamingDealsIndia"
            
            # Category: Beauty & Personal Care
            elif [[ "$TITLE" =~ "Lakme"|"Beauty"|"Skin"|"Serum"|"Lipstick"|"Cream" ]]; then
                EXTRAS="#BeautyDeals #SkincareIndia #MakeupLoot"

            # Category: Fashion & Footwear
            elif [[ "$TITLE" =~ "Kurta"|"Shirt"|"Topwear"|"Jean"|"Shoe"|"Backpack"|"Clothing" ]]; then
                EXTRAS="#FashionDealsIndia #MyntraSale #AjioLoot #OOTDIndia"

            # Category: Grocery & Household
            elif [[ "$TITLE" =~ "Veeba"|"Food"|"Grocery"|"Kitchen"|"Bottle" ]]; then
                EXTRAS="#GroceryDeals #HomeEssentials #KitchenHacks"
            fi

            # 3. India-Specific High Reach Viral Set
            VIRAL_TAGS="#LootAlert #OnlineShoppingIndia #BestPriceZone #AmazonFindsIndia #FlipkartDeals"
            
            HASHTAGS="$VIRAL_TAGS $EXTRAS"

            echo "Posting ($((i+1))/$NEW_COUNT): $TITLE"

            # 4. Optimized Caption for Reach (Using -F for multipart/form-data)
            curl -X POST "https://graph.facebook.com/v18.0/${{ secrets.FB_PAGE_ID }}/photos" \
            -F "url=$IMG_URL" \
            -F "caption=🚨 BIG SAVINGS: $TITLE

          ✨ Don't pay full price! Grab this deal now on Best Price Zone.

          🛒 Shop Here: $LINK

          $HASHTAGS" \
            -F "published=true" \
            -F "access_token=${{ secrets.FB_PAGE_TOKEN }}"
            
            sleep 10
          done

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
