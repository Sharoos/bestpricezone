name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/6 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          # 1. Force remove any lingering .env file to prevent "Bot" mode override
          rm -f .env
          
          # 2. Inject parameters directly as environment variables
          export HERO_BANNER=banner.jpg
          export HERO_HEIGHT=300px
          export MAX_KEEP=300
          export CLEAN_IMAGES_ON_RUN=0
          
          # 3. Execute the script
          python telegram_to_site.py

      - name: Commit & push persisted assets
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add assets even if ignored by .gitignore
          git add -f assets/state.db assets/cards.json assets/images/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update deals and state [skip ci]"
            git push origin main
          fi

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
