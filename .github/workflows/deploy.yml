name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create .env from repository secrets (runner only)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          cat > .env <<EOF
          TG_API_ID=${TG_API_ID}
          TG_API_HASH=${TG_API_HASH}
          TG_STRING_SESSION=${TG_STRING_SESSION}
          CHANNEL_USERNAME=${CHANNEL_USERNAME}
          HERO_BANNER=banner.jpg
          HERO_HEIGHT=300px
          MAX_KEEP=200
          CLEAN_IMAGES_ON_RUN=0
          EOF
          echo ".env created for build (runner only)"

      - name: Run site build script
        run: python telegram_to_site.py

      - name: Upload site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            assets

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
