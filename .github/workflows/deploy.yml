name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# IMPORTANT: allow contents write so the runner can push updated assets/state.db back to repo
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v1
          restore-keys: |
            pip-cache-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Debug: show whether origin/main already has assets/state.db (helps confirm persisted state)
      - name: Verify origin/main has assets (debug)
        run: |
          git fetch origin main --depth=1 || true
          echo "Listing assets in origin/main (if any):"
          git ls-tree -r origin/main --name-only | grep '^assets/' || echo "origin/main has no assets/"
          if git ls-tree -r origin/main --name-only | grep -q '^assets/state.db'; then
            echo "assets/state.db exists in origin/main"
          else
            echo "assets/state.db NOT found in origin/main"
          fi

      - name: Show assets snapshot (for debugging)
        run: |
          echo "Assets dir listing (workdir):"
          ls -la assets || echo "assets missing"

      - name: Create .env for runner (do not indent the file contents)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          cat > .env <<'EOF'
TG_API_ID=${TG_API_ID}
TG_API_HASH=${TG_API_HASH}
TG_STRING_SESSION=${TG_STRING_SESSION}
CHANNEL_USERNAME=${CHANNEL_USERNAME}
HERO_BANNER=banner.jpg
HERO_HEIGHT=300px
MAX_KEEP=200
CLEAN_IMAGES_ON_RUN=0
EOF
          echo ".env written (runner)."

      - name: Run site build script
        # also export the important env vars to be absolutely sure Python sees them
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          MAX_KEEP: "200"
          CLEAN_IMAGES_ON_RUN: "0"
        run: |
          echo "Running telegram_to_site.py (MAX_KEEP=$MAX_KEEP)"
          python telegram_to_site.py

      - name: Show assets AFTER build (debug)
        run: |
          echo "---- assets listing (after) ----"
          ls -la assets || true
          echo "---- images count ----"
          find assets/images -type f | wc -l || true
          if [ -f assets/state.db ]; then
            echo "state.db present AFTER build"
            if command -v sqlite3 >/dev/null 2>&1; then
              echo "cards count (after):"
              sqlite3 assets/state.db "SELECT count(*) FROM cards;" || echo "sqlite read failed"
            fi
          fi
          echo "---- head of assets/cards.json (if present) ----"
          head -n 50 assets/cards.json || true

      # Commit updated state + cards + images back to repo so next run has them
      - name: Commit updated state, cards and images back to repo
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          # Force-add assets in case a prior .gitignore entry still lingers in history
          git add -f assets || true
          # Add state and json explicitly too (safe)
          git add -f assets/state.db assets/cards.json || true
          # Also add images directory
          git add -f assets/images || true
          echo "Git status (staged):"
          git status --porcelain=v1 --short || true
          if git diff --staged --quiet; then
            echo "No assets changes to commit."
          else
            git commit -m "Update persisted state and images [skip ci]" || true
            echo "Attempting to push updated assets to origin/main..."
            if ! git push origin HEAD:main; then
              echo "Push failed. Dumping git remote + logs for debugging:"
              git remote -v
              git log -n 5 --oneline --decorate
              git show --name-only --pretty="" HEAD || true
              exit 1
            else
              echo "Push succeeded."
            fi
          fi

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets site/ || true

      - name: Upload site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
