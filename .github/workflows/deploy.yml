name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/6 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests  # Added explicitly to ensure they exist

      - name: Create .env
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          printf 'TG_API_ID=%s\n' "$TG_API_ID" > .env
          printf 'TG_API_HASH=%s\n' "$TG_API_HASH" >> .env
          printf 'TG_STRING_SESSION=%s\n' "$TG_STRING_SESSION" >> .env
          printf 'CHANNEL_USERNAME=%s\n' "$CHANNEL_USERNAME" >> .env
          printf 'HERO_BANNER=banner.jpg\n' >> .env
          printf 'HERO_HEIGHT=300px\n' >> .env
          printf 'MAX_KEEP=300\n' >> .env
          printf 'CLEAN_IMAGES_ON_RUN=0\n' >> .env
          echo ".env created without Bot Token."

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          python telegram_to_site.py

      - name: Commit & push persisted assets
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/state.db assets/cards.json assets/images/ || true
          git commit -m "Update deals and state [skip ci]" || echo "No changes"
          git push origin main || echo "Push failed"

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
