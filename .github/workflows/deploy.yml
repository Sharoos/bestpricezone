name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests
          sudo apt-get install jq -y # ADDED: Required to read the JSON deal data

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          rm -f .env
          export HERO_BANNER=banner.jpg
          export HERO_HEIGHT=300px
          export MAX_KEEP=300
          export CLEAN_IMAGES_ON_RUN=0
          python telegram_to_site.py

      - name: Commit and Push changes
        id: git_commit # ADDED: ID so the next step knows if a deal was found
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f assets/state.db assets/cards.json assets/images/ index.html || true
          
          if git diff --staged --quiet; then
            echo "No new deals found. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            # REMOVED [skip ci] so the post logic can see the change
            git commit -m "Update deals and database"
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      # --- NEW: FACEBOOK POSTING SECTION ---
      - name: Post to Facebook
        # Only runs if the previous step actually pushed a new deal
        if: steps.git_commit.outputs.pushed == 'true'
        run: |
          echo "Waiting 60s for GitHub Pages to refresh the image..."
          sleep 60
          
          # Read the latest deal from your cards.json
          TITLE=$(jq -r '.[0].title' assets/cards.json)
          LINK=$(jq -r '.[0].buy_link' assets/cards.json)
          IMG_PATH=$(jq -r '.[0].local_image' assets/cards.json)
          IMG_URL="https://bestpricezone.in/$IMG_PATH"
          
          curl -X POST "https://graph.facebook.com/v18.0/${{ secrets.FB_PAGE_ID }}/photos" \
          -d "url=$IMG_URL" \
          -d "caption=$TITLE %0A%0A🛒 Shop Now: $LINK %0A%0A#BestPriceZone #Deals" \
          -d "access_token=${{ secrets.FB_PAGE_TOKEN }}"

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
