name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests
          sudo apt-get install jq -y

      - name: Run site build script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          rm -f .env
          export HERO_BANNER=banner.jpg
          export HERO_HEIGHT=300px
          export MAX_KEEP=300
          export CLEAN_IMAGES_ON_RUN=0
          python telegram_to_site.py

      - name: Commit and Push changes
        id: git_commit
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f assets/state.db assets/cards.json assets/images/ index.html || true
          
          if git diff --staged --quiet; then
            echo "No new deals found. Skipping commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            # REMOVED [skip ci] to ensure the workflow finishes the Facebook post
            git commit -m "Update deals and database"
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: steps.git_commit.outputs.pushed == 'true'
        run: |
          # 1. Get the number of new deals
          NEW_COUNT=$(git diff HEAD^ HEAD assets/cards.json | grep '+    "title":' | wc -l)
          
          echo "Found $NEW_COUNT new deals. Posting them to Facebook..."

          # 2. Loop through each new deal
          for (( i=0; i<$NEW_COUNT; i++ ))
          do
            TITLE=$(jq -r ".[$i].title" assets/cards.json)
            LINK=$(jq -r ".[$i].buy_link" assets/cards.json)
            IMG_PATH=$(jq -r ".[$i].local_image" assets/cards.json)
            IMG_URL="https://raw.githubusercontent.com/Sharoos/bestpricezone/main/$IMG_PATH"

            # 3. Enhanced 2026 India Market Hashtag Research
            # Mixing broad reach tags with specific Indian buyer intent
            EXTRAS=""
            if [[ "$TITLE" =~ "Samsung"|"Phone"|"Watch"|"Mobile"|"Earbuds"|"TV" ]]; then 
                EXTRAS="%23TechDealsIndia %23GadgetLoot %23SmartphoneOffers"
            elif [[ "$TITLE" =~ "Shirt"|"Wear"|"Fashion"|"Cloth"|"Shoes"|"Vintage" ]]; then 
                EXTRAS="%23StreetwearIndia %23FashionDeals %23OOTDIndia"
            elif [[ "$TITLE" =~ "Kitchen"|"Home"|"Cooker"|"Decor" ]]; then 
                EXTRAS="%23IndianHome %23KitchenHacks %23HomeEssentials"
            fi

            # Top trending 'Loot' tags for Indian shopping groups in 2026
            VIRAL_TAGS="%23LootAlert %23OnlineShoppingIndia %23BestPriceZone %23AmazonFindsIndia"
            HASHTAGS="$VIRAL_TAGS $EXTRAS"

            echo "Posting ($((i+1))/$NEW_COUNT): $TITLE"

            # 4. Execute Post with optimized stop-the-scroll caption
            # Added emoji triggers: 🔥, 💸, 🛒, ⚡
            curl -X POST "https://graph.facebook.com/v18.0/${{ secrets.FB_PAGE_ID }}/photos" \
            -d "url=$IMG_URL" \
            -d "caption=🔥 NEW PRICE DROP: $TITLE %0A%0A💸 Best price guaranteed. Grab it before the deal expires! %0A%0A🛒 Shop Now: $LINK %0A%0A$HASHTAGS" \
            -d "access_token=${{ secrets.FB_PAGE_TOKEN }}"
            
            # 5. Anti-Spam Safety: 10s sleep is safer for high-volume pushes in 2026
            sleep 10
          done

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/ || true
          cp -r assets site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
