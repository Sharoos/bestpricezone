name: Build & Publish Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # ensure we can push back to the repo later
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # -------------------------
      # Cache pip packages to speed up install
      # -------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v1
          restore-keys: |
            pip-cache-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # -------------------------
      # Restore persisted state (if present in repo already)
      # You get state + cards + images from the repo since we commit them back later
      # If they aren't present yet, the run will create them.
      # -------------------------
      - name: Show assets snapshot (for debugging)
        run: |
          echo "Assets dir listing:"
          ls -la assets || true

      - name: Create .env from repository secrets (runner only)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: |
          cat > .env <<EOF
          TG_API_ID=${TG_API_ID}
          TG_API_HASH=${TG_API_HASH}
          TG_STRING_SESSION=${TG_STRING_SESSION}
          CHANNEL_USERNAME=${CHANNEL_USERNAME}
          HERO_BANNER=banner.jpg
          HERO_HEIGHT=300px
          MAX_KEEP=200
          CLEAN_IMAGES_ON_RUN=0
          EOF
          echo ".env created for build (runner only)"

      - name: Run site build script
        run: python telegram_to_site.py

      # -------------------------
      # Commit updated state + cards + images back to repo so next run has them
      # We add [skip ci] so this push does not trigger the workflow again.
      # -------------------------
      - name: Commit updated state, cards and images back to repo
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          # Make sure git knows who we are (checkout used persist-credentials)
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          # Add changed DB, JSON and images (if present). Use || true so step doesn't fail if nothing changed.
          git add assets/state.db assets/cards.json || true
          # Add all images under assets/images (helps preserve image files)
          git add assets/images || true

          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No assets changes to commit."
          else
            git commit -m "Update persisted state and images [skip ci]" || true
            # Push back to the branch. Use force-with-lease to be safer.
            git push origin HEAD:main || echo "Push failed (possibly due to permissions); ensure GITHUB_TOKEN is allowed to push."
          fi

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets site/

      - name: Upload site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
