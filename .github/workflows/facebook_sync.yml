name: Facebook Auto Post

on:
  push:
    branches:
      - main
    paths:
      - 'assets/cards.json' # The script only runs when this file is updated
  workflow_dispatch: # This adds the "Run workflow" button in GitHub Actions!

jobs:
  post-to-fb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Data from JSON
        id: deal
        run: |
          # Use jq to grab the latest deal (index 0)
          TITLE=$(jq -r '.[0].title' assets/cards.json)
          LINK=$(jq -r '.[0].buy_link' assets/cards.json)
          IMG_PATH=$(jq -r '.[0].local_image' assets/cards.json)
          
          # Construct the absolute URL for the image
          IMG_URL="https://bestpricezone.in/$IMG_PATH"
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "link=$LINK" >> $GITHUB_OUTPUT
          echo "img=$IMG_URL" >> $GITHUB_OUTPUT

      - name: Post to Facebook
        run: |
          # Wait 60 seconds for GitHub Pages to deploy the image
          sleep 60
          
          curl -X POST "https://graph.facebook.com/v18.0/${{ secrets.FB_PAGE_ID }}/photos" \
          -d "url=${{ steps.deal.outputs.img }}" \
          -d "caption=${{ steps.deal.outputs.title }} %0A%0A🛒 Shop Now: ${{ steps.deal.outputs.link }} %0A%0A#BestPriceZone #Deals" \
          -d "access_token=${{ secrets.FB_PAGE_TOKEN }}"
